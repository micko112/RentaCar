<div class="search-hero-container">
  <div class="search-content">
    <h1>RENT A CAR BEOGRAD</h1>
    <h2 *ngIf="userService.getUserStatus() === 'user'" >IZABERITE LOKACIJU I VREME</h2>

    <form [formGroup]="searchForm" (ngSubmit)="performSearch()" *ngIf="userService.getUserStatus() === 'user'" class="booking-form">

      <!-- Left Section: Pick-up -->
      <div class="form-section pickup-section">
        <label class="section-title">Preuzimanje</label>
        <div class="fields-wrapper">
          <!-- Polje za lokaciju -->
          <div class="field-item">
            <i class="fas fa-map-marker-alt"></i>
            <select formControlName="pickupLocation">
                <option [ngValue]="null" selected disabled>Lokacija</option>
              <option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
            </select>
          </div>

          <!-- Polje za datum -->
          <div class="field-item">
            <label>
              <i class="fas fa-calendar-alt"></i>
              <input type="date" placeholder="Date" formControlName="pickupDate">
            </label>
          </div>
        </div>
      </div>

      <div class = "middle-border">
      </div>

      <!-- Right Section: Drop-off -->
      <div class="form-section"> <!-- Uklonjena 'pickup-section' klasa -->
        <label class="section-title">Vraćanje</label> <!-- Ispravljen naslov -->
        <div class="fields-wrapper">
          <!-- Polje za lokaciju -->
          <div class="field-item">
            <i class="fas fa-map-marker-alt"></i>
            <select formControlName="dropoffLocation"> <!-- Ispravljen formControlName -->
              <option [ngValue]="null" selected disabled>Lokacija</option>
              <option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
            </select>
          </div>

          <!-- Polje za datum -->
          <div class="field-item">
            <label>
              <i class="fas fa-calendar-alt"></i>
              <input type="date" placeholder="Date" formControlName="dropoffDate"> <!-- Ispravljen formControlName -->
            </label>
          </div>
        </div>
      </div>

    </form>
  </div>
</div>

<!-- Car list starts below -->
<div class="car-list-section">
  <div class="list-header">
    <h2>IZABERI VOZILO</h2>
    <div class="filter-and-actions-bar">
      <!-- Filters are now inside their own container -->
      <div class="filter-bar">
        <button
          class="filter-button"
          *ngFor="let category of categories"
          [class.active]="category === activeCategory"
          (click)="filterByCategory(category)">
          {{category}}
        </button>
      </div>

      <!-- Add button, visible only to admin -->
      <div class="add-button-container" *ngIf="userService.getUserStatus() === 'admin'">
        <button class="button add-button" routerLink="/cars/add">
          + DODAJ VOZILO
        </button>
      </div>
    </div>
    <!-- We can add filters back here if needed -->
  </div>
  <div class="card-list">
    <app-car-card
      *ngFor="let c of filteredCars"
      [car]="c"
      [searchParams]="searchForm.value"
      (removedCar)="deleteCar(c)">
    </app-car-card>
  </div>
</div>
